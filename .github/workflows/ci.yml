name: CI

on:
  push:
    branches: [develop, master, main, stable, beta]
    tags: ['v2.*']
  pull_request:
    branches: [develop, master, main, beta, stable]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SonarScanner
        if: env.SONAR_TOKEN != ''
        shell: pwsh
        run: dotnet tool install --tool-path .sonar/scanner dotnet-sonarscanner

      - name: Install coverage tool
        shell: pwsh
        run: dotnet tool install --tool-path .coverage/tools dotnet-coverage

      - name: Restore
        run: dotnet restore src/EventHook.sln

      - name: Build
        run: dotnet build src/EventHook.sln -c Release --no-restore

      - name: Begin SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        shell: pwsh
        run: >
          .\.sonar\scanner\dotnet-sonarscanner begin
          /k:"justcoding121_windows-user-action-hook"
          /o:"justcoding121"
          /d:sonar.token="$env:SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage/coverage.xml"
          /d:sonar.exclusions="**/docs/**,**/docs-src/**,**/examples/**,**/_site/**,**/.github/**"

      - name: Build for SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: dotnet build src/EventHook.sln -c Release --no-restore --no-incremental

      - name: Unit tests
        shell: pwsh
        run: |
          dotnet test tests/EventHook.Tests/EventHook.Tests.csproj -c Release --no-build --logger trx --collect:"Code Coverage" --results-directory coverage/unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Integration tests
        shell: pwsh
        run: |
          dotnet test tests/EventHook.IntegrationTests/EventHook.IntegrationTests.csproj -c Release --no-build --logger trx --collect:"Code Coverage" --results-directory coverage/integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Merge code coverage
        shell: pwsh
        run: .\.coverage\tools\dotnet-coverage merge "coverage\**\*.coverage" --output coverage/coverage.xml --output-format xml

      - name: Complete SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        shell: pwsh
        run: .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage
          if-no-files-found: ignore

      - name: Install DocFX
        run: dotnet tool restore

      - name: Build docs
        run: |
          dotnet tool run docfx metadata docfx.json
          dotnet tool run docfx build docfx.json

      - name: Upload docs site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site

  publish:
    name: Publish NuGet package
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/tags/v2'))
    runs-on: windows-latest
    environment: nuget-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack Beta
        if: github.ref == 'refs/heads/beta'
        run: dotnet pack src/EventHook/EventHook.csproj -c Release --version-suffix beta -o artifacts

      - name: Pack Stable
        if: github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/tags/v2')
        run: dotnet pack src/EventHook/EventHook.csproj -c Release -o artifacts

      - name: Resolve package version
        id: package
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts -Filter EventHook.*.nupkg | Where-Object { $_.Name -notlike '*.symbols.*' -and $_.Name -notlike '*.snupkg' } | Select-Object -First 1
          if (-not $package) { throw "No NuGet package was produced." }
          if ($package.BaseName -notmatch '^EventHook\.(.+)$') {
            throw "Unexpected package name: $($package.Name)"
          }
          $version = $Matches[1]
          "name=$($package.Name)" >> $env:GITHUB_OUTPUT
          "path=$($package.FullName)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version -match '-beta') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          Write-Host "Package $($package.Name) version=$version"

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        run: dotnet nuget push "${{ steps.package.outputs.path }}" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.package.outputs.tag }}"
          $version = "${{ steps.package.outputs.version }}"
          $package = "${{ steps.package.outputs.path }}"
          $prerelease = "${{ steps.package.outputs.prerelease }}" -eq "true"

          if (gh release view $tag 2>$null) {
            Write-Host "Release $tag already exists; uploading package asset if missing."
            gh release upload $tag $package --clobber
          }
          else {
            $args = @(
              "release", "create", $tag,
              $package,
              "--title", "EventHook $version",
              "--generate-notes",
              "--target", $env:GITHUB_SHA
            )
            if ($prerelease) { $args += "--prerelease" }
            gh @args
          }

      - name: Download docs site
        if: github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/tags/v2')
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: _site

      - name: Deploy GitHub Pages
        if: github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/tags/v2')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: docs
